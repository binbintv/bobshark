<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BobShark - Quản Trị Admin</title>
<style>
   body {
    margin: 0;
    font-family: Segoe UI, sans-serif;
    background: linear-gradient(180deg, #001d3d, #003566);
    color: #fff;
    min-height: 100vh;

    display:flex;
    flex-direction:column;
}
    .header {
        background: rgba(0,0,0,0.3);
        padding: 20px 40px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .header h1 {
        margin: 0;
        font-size: 28px;
    }
    .container{
    flex:1;
    width:95%;
    max-width:1600px;
    margin:30px auto;
    padding:0 20px;
}
    .card {
        background: rgba(255,255,255,0.08);
        border-radius: 16px;
        padding: 25px;
        margin-bottom: 25px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(255,255,255,0.05);
        border-radius: 12px;
        overflow: hidden;
    }
    th, td {
        padding: 16px;
        text-align: left;
        border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    th {
        background: #1976ff;
        color: white;
    }
    tr:hover {
        background: rgba(255,255,255,0.1);
    }
    .btn {
        padding: 10px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        margin: 5px;
    }
    .btn-primary { background: #ffd60a; color: #000; }
    .btn-danger { background: #ef4444; color: white; }
    .stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 30px;
    }
    .stat-card {
        background: rgba(255,255,255,0.1);
        padding: 20px;
        border-radius: 12px;
        text-align: center;
    }
    .stat-number {
        font-size: 32px;
        font-weight: bold;
        color: #ffd60a;
    }
    .footer {
        text-align: center;
        padding: 20px;
        opacity: 0.7;
        font-size: 14px;
    }
</style>
</head>
<body>

<div class="header">
    <h1>👑 BobShark - Quản Trị Admin</h1>
    <button class="btn btn-danger" onclick="logoutAdmin()">Đăng xuất</button>
</div>

<div class="container">

    <div class="stats">
        <div class="stat-card">
            <div class="stat-number" id="totalUsers">0</div>
            <div>Tổng Người Dùng</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="totalStars">0</div>
            <div>Tổng Sao</div>
        </div>
        <div class="stat-card">
            <div class="stat-number" id="completedUsers">0</div>
            <div>Hoàn thành 7 ngày</div>
        </div>
    </div>

    <div class="card">
        <h2>📋 Danh sách Người dùng</h2>
        <table id="userTable">
            <thead>
                <tr>
                    <th>Tên</th>
                    <th>Username</th>
                    <th>Ngày Sinh</th>
                    <th>Ngày Tham Gia</th>
                    <th>Sao</th>
                    <th>Tiến Độ</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div class="card">
        <button class="btn btn-primary" onclick="loadUsers()">🔄 Tải Lại Dữ Liệu</button>
        <button class="btn btn-danger" onclick="resetAllData()">🗑️ Reset Dữ Liệu</button>
    </div>
</div>

<footer class="footer">
    <p>BobShark Admin Panel • Made by Cubinzz</p>
</footer>

<!-- ================== FIREBASE ================== -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
// Firebase Config
const firebaseConfig = {
    apiKey: "AIzaSyDGX-qWZTPgOszBO-Mem4wKwh-HpMACPUk",
    authDomain: "bobshark-fbdfb.firebaseapp.com",
    projectId: "bobshark-fbdfb",
    storageBucket: "bobshark-fbdfb.firebasestorage.app",
    messagingSenderId: "810024180746",
    appId: "1:810024180746:web:4419819dff374b5a04d3f3"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

// Load dữ liệu từ Cloud
async function loadUsers() {
    const tbody = document.querySelector('#userTable tbody');
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;">Đang tải dữ liệu từ cloud...</td></tr>';

    let totalStars = 0;
    let completed = 0;
    let count = 0;

    try {
        const snapshot = await db.collection("users").get();
        tbody.innerHTML = '';

        snapshot.forEach(doc => {
            const user = doc.data();
            count++;
          let progress = 0;

if(user.progress){

    if(Array.isArray(user.progress)){
        progress = user.progress.filter(Boolean).length;
    }

    else{
        progress = Object.values(user.progress)
            .filter(v => v === true)
            .length;
    }

}
            if (progress === 7) completed++;
            totalStars += user.stars || 0;

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${user.name || 'Không tên'}</td>
                <td>${user.email || ''}</td>
                <td>${user.birth ? new Date(user.birth).toLocaleDateString('vi-VN') : '-'}</td>
                <td>${user.startDate ? new Date(user.startDate).toLocaleDateString('vi-VN') : '-'}</td>
                <td><strong>${user.stars || 0}</strong> ⭐</td>
                <td>${progress}/7</td>
            `;
            tbody.appendChild(row);
        });

        document.getElementById('totalUsers').textContent = count;
        document.getElementById('totalStars').textContent = totalStars;
        document.getElementById('completedUsers').textContent = completed;

        if (count === 0) {
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:#aaa;">Chưa có người dùng nào</td></tr>';
        }
    } catch(e) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center;color:red;">Lỗi tải dữ liệu: ${e.message}</td></tr>`;
    }
}

function resetAllData() {
    alert("Để reset dữ liệu cloud, vui lòng liên hệ chủ web.");
}

function logoutAdmin() {
    if(confirm("Đăng xuất?")) {
        localStorage.removeItem('currentAdmin');
        window.location.href = 'index.html';
    }
}

window.onload = loadUsers;
</script>
</body>
</html>
