<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BobShark Admin</title>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0b3d91;
    color:white;
}

.container{
    width:95%;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

.card{
    background:rgba(255,255,255,0.1);
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
}

button{
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
    cursor:pointer;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    color:black;
}

th,td{
    border:1px solid #ccc;
    padding:10px;
    text-align:center;
}

.hidden{
    display:none;
}

.stat{
    display:inline-block;
    margin-right:20px;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>👑 BobShark Admin</h1>

<div id="loginBox" class="card">

<h2>Đăng nhập Admin</h2>

<input id="adminUser" placeholder="Tên đăng nhập">

<input id="adminPass" type="password" placeholder="Mật khẩu">

<button onclick="adminLogin()">Đăng nhập</button>

</div>

<div id="adminPanel" class="hidden">

<div class="card">

<h2>📊 Thống kê</h2>

<div class="stat">
👥 Người dùng:
<span id="totalUsers">0</span>
</div>

<div class="stat">
⭐ Tổng sao:
<span id="totalStars">0</span>
</div>

</div>

<div class="card">

<h2>Danh sách người dùng</h2>

<table>

<thead>
<tr>
<th>Họ tên</th>
<th>Email</th>
<th>Ngày sinh</th>
<th>Nghề nghiệp</th>
<th>Sao</th>
<th>Tiến độ</th>
</tr>
</thead>

<tbody id="userTable"></tbody>

</table>

</div>

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDGX-qWZTPgOszBO-Mem4wKwh-HpMACPUk",

authDomain: "bobshark-fbdfb.firebaseapp.com",

projectId: "bobshark-fbdfb",

storageBucket: "bobshark-fbdfb.firebasestorage.app",

messagingSenderId: "810024180746",

appId: "1:810024180746:web:4419819dff374b5a04d3f3",

measurementId: "G-3G7YCWW9JZ"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

const ADMIN_USER = "admin";
const ADMIN_PASS = "admin123";

window.adminLogin = async function(){

const user =
document.getElementById("adminUser").value;

const pass =
document.getElementById("adminPass").value;

if(
user !== ADMIN_USER ||
pass !== ADMIN_PASS
){
alert("Sai tài khoản Admin");
return;
}

document.getElementById("loginBox")
.classList.add("hidden");

document.getElementById("adminPanel")
.classList.remove("hidden");

loadUsers();

}

async function loadUsers(){

const snapshot =
await getDocs(
collection(db,"users")
);

let totalUsers = 0;
let totalStars = 0;

const tbody =
document.getElementById("userTable");

tbody.innerHTML = "";

snapshot.forEach((docSnap)=>{

const data = docSnap.data();

totalUsers++;

totalStars += Number(data.stars || 0);

let completed = 0;

if(data.progress){

for(let i=1;i<=7;i++){

if(data.progress["day"+i])
completed++;

}

}

tbody.innerHTML += `
<tr>

<td>${data.name || ""}</td>

<td>${data.email || ""}</td>

<td>${data.birth || ""}</td>

<td>${data.career || ""}</td>

<td>${data.stars || 0}</td>

<td>${completed}/7</td>

</tr>
`;

});

document.getElementById("totalUsers")
.innerText = totalUsers;

document.getElementById("totalStars")
.innerText = totalStars;

}

</script>

</body>
</html>
