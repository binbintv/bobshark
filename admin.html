<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>BobShark Admin</title>

<style>
body{
font-family:Arial;
background:#0b3d91;
padding:20px;
color:white;
}

h1{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
background:white;
color:black;
}

th,td{
padding:12px;
border:1px solid #ddd;
text-align:center;
}

th{
background:#1976ff;
color:white;
}
</style>
</head>

<body>

<h1>👑 BobShark Admin</h1>

<table>

<thead>
<tr>
<th>Tên</th>
<th>Email</th>
<th>Nghề</th>
<th>Ngày sinh</th>
<th>Sao</th>
</tr>
</thead>

<tbody id="userTable"></tbody>

</table>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyDGX-qWZTPgOszBO-Mem4wKwh-HpMACPUk",

authDomain: "bobshark-fbdfb.firebaseapp.com",

projectId: "bobshark-fbdfb",

storageBucket: "bobshark-fbdfb.firebasestorage.app",

messagingSenderId: "810024180746",

appId: "1:810024180746:web:4419819dff374b5a04d3f3"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

async function loadUsers(){

const snapshot =
await getDocs(collection(db,"users"));

const table =
document.getElementById("userTable");

table.innerHTML="";

snapshot.forEach(doc=>{

const user = doc.data();

table.innerHTML += `
<tr>
<td>${user.name||""}</td>
<td>${user.email||""}</td>
<td>${user.career||""}</td>
<td>${user.birth||""}</td>
<td>${user.stars||0}</td>
</tr>
`;

});

}

loadUsers();

</script>

</body>
</html>
