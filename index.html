<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BobShark AI</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(180deg,#4facfe,#003566);
min-height:100vh;
color:white;
}

header{
padding:20px;
text-align:center;
}

.logo{
font-size:40px;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-10px)}
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
padding:20px;
border-radius:20px;
margin-bottom:20px;
}

h2{
margin-bottom:15px;
}

input,select{
width:100%;
padding:12px;
border:none;
border-radius:10px;
margin-top:8px;
margin-bottom:15px;
}

button{
background:#ffd60a;
border:none;
padding:12px 20px;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:.9;
}

.result{
margin-top:15px;
padding:15px;
background:rgba(255,255,255,.2);
border-radius:12px;
}

.days{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(120px,1fr));
gap:10px;
}

.day{
padding:15px;
border-radius:12px;
background:rgba(255,255,255,.15);
text-align:center;
cursor:pointer;
}

.day.done{
background:#00c853;
}

.modal{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.6);
justify-content:center;
align-items:center;
}

.modal-content{
background:white;
color:black;
padding:25px;
border-radius:20px;
max-width:400px;
text-align:center;
}

.footer{
text-align:center;
padding:20px;
opacity:.8;
}

</style>
</head>

<body>

<header>
<div class="logo">🦈</div>
<h1>BobShark AI</h1>
<p>Đồng hành cùng bạn khám phá tương lai</p>
</header>

<div class="container">

<div class="card">

<h2>Thông tin cá nhân</h2>

<input
id="name"
placeholder="Nhập họ và tên"
/>

<select id="interest">
<option>Công nghệ</option>
<option>Y tế</option>
<option>Kinh doanh</option>
<option>Thiết kế</option>
<option>Giáo dục</option>
</select>

<button onclick="analyze()">
🚀 Phân tích nghề nghiệp
</button>

<div
id="result"
class="result"
style="display:none"
></div>

</div>

<div class="card">

<h2>📅 Hành trình 7 ngày</h2>

<div class="days" id="days"></div>

</div>

<div class="card">

<h2>🎁 Gacha</h2>

<button onclick="openGacha()">
Mở Gacha
</button>

</div>

</div>

<div class="footer">
BobShark AI MVP 2026
</div>

<div class="modal" id="modal">

<div class="modal-content">

<h2>🦈 BobShark</h2>

<p>

Ôi khôngggg 😵‍💫

<br><br>

Xưởng chế tạo quà của Bob
đang được nâng cấp.

<br><br>

Tính năng Gacha hiện đang bảo trì 🚧

<br><br>

Hãy tiếp tục hoàn thành nhiệm vụ
để tích lũy sao nhé ⭐

</p>

<br>

<button onclick="closeGacha()">
Đã hiểu
</button>

</div>

</div>

<script>

const careerMap = {
"Công nghệ":{
career:"Công nghệ thông tin",
school:"UIT, Bách Khoa, FPT"
},
"Y tế":{
career:"Y khoa",
school:"ĐH Y Dược TP.HCM"
},
"Kinh doanh":{
career:"Marketing",
school:"UEH"
},
"Thiết kế":{
career:"Thiết kế đồ họa",
school:"Văn Lang"
},
"Giáo dục":{
career:"Sư phạm",
school:"ĐH Sư phạm TP.HCM"
}
};

function analyze(){

const name =
document.getElementById("name").value;

const interest =
document.getElementById("interest").value;

if(name.trim()===""){
alert("Vui lòng nhập họ tên");
return;
}

localStorage.setItem(
"bob_name",
name
);

localStorage.setItem(
"bob_interest",
interest
);

const data =
careerMap[interest];

const result =
document.getElementById("result");

result.style.display="block";

result.innerHTML=`

<h3>Xin chào ${name} 👋</h3>

<p>

🦈 BobShark đã phân tích xong!

</p>

<br>

<b>Ngành phù hợp:</b>

${data.career}

<br><br>

<b>Trường gợi ý:</b>

${data.school}

<br><br>

⭐ Mức độ phù hợp:
${Math.floor(Math.random()*10)+90}%

`;

}

const daysContainer =
document.getElementById("days");

for(let i=1;i<=7;i++){

const div =
document.createElement("div");

div.className="day";

div.innerHTML=
`
Ngày ${i}
<br>
🔒
`;

div.onclick=()=>{

div.classList.toggle("done");

if(div.classList.contains("done")){

div.innerHTML=
`
Ngày ${i}
<br>
✅
`;

}else{

div.innerHTML=
`
Ngày ${i}
<br>
🔒
`;

}

};

daysContainer.appendChild(div);

}

function openGacha(){
document.getElementById("modal")
.style.display="flex";
}

function closeGacha(){
document.getElementById("modal")
.style.display="none";
}

window.onload=()=>{

const name=
localStorage.getItem("bob_name");

if(name){

document.getElementById("name")
.value=name;

}

};

</script>

</body>
</html>
