<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BobShark Firebase</title>

<style>
body{
    background:#0b3d91;
    font-family:Arial,sans-serif;
    color:white;
    margin:0;
}

.container{
    width:90%;
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:rgba(255,255,255,0.12);
    padding:20px;
    border-radius:15px;
    margin-top:20px;
}

input,select{
    width:100%;
    padding:12px;
    margin-top:10px;
    border:none;
    border-radius:10px;
}

button{
    margin-top:10px;
    padding:12px;
    border:none;
    border-radius:10px;
    background:#2d7fff;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#1f65d6;
}

.hidden{
    display:none;
}
</style>
</head>

<body>

<div class="container">

<h1>🦈 BobShark AI</h1>

<div class="card">

<h2>Tạo tài khoản</h2>

<input id="name" placeholder="Họ và tên">

<input id="birth" type="date">

<select id="career">
<option>CNTT</option>
<option>AI Engineer</option>
<option>Bác sĩ</option>
<option>Giáo viên</option>
<option>Kỹ sư</option>
</select>

<input id="email" type="email" placeholder="Email">

<input id="password" type="password" placeholder="Mật khẩu">

<button onclick="register()">Đăng ký</button>

<hr>

<h2>Đăng nhập</h2>

<input id="loginEmail" type="email" placeholder="Email">

<input id="loginPassword" type="password" placeholder="Mật khẩu">

<button onclick="login()">Đăng nhập</button>

</div>

<div id="dashboard" class="card hidden">

<h2>Xin chào <span id="userName"></span></h2>

<p>Email: <span id="userEmail"></span></p>

<p>Ngày sinh: <span id="userBirth"></span></p>

<p>Nghề mong muốn: <span id="userCareer"></span></p>

<p>⭐ Sao: <span id="userStars"></span></p>

</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyDGX-qWZTPgOszBO-Mem4wKwh-HpMACPUk",
authDomain: "bobshark-fbdfb.firebaseapp.com",
projectId: "bobshark-fbdfb",
storageBucket: "bobshark-fbdfb.firebasestorage.app",
messagingSenderId: "810024180746",
appId: "1:810024180746:web:4419819dff374b5a04d3f3",
measurementId: "G-3G7YCWW9JZ"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

window.register = async function(){

try{

const name = document.getElementById("name").value;
const birth = document.getElementById("birth").value;
const career = document.getElementById("career").value;
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;

const userCredential =
await createUserWithEmailAndPassword(
auth,
email,
password
);

const uid = userCredential.user.uid;

await setDoc(doc(db,"users",uid),{

name:name,
birth:birth,
career:career,
email:email,

stars:0,

registerDate:new Date().toISOString(),

progress:{
day1:false,
day2:false,
day3:false,
day4:false,
day5:false,
day6:false,
day7:false
}

});

alert("Đăng ký thành công");

}
catch(error){

alert(error.message);

}

}

window.login = async function(){

try{

const email =
document.getElementById("loginEmail").value;

const password =
document.getElementById("loginPassword").value;

const userCredential =
await signInWithEmailAndPassword(
auth,
email,
password
);

const uid =
userCredential.user.uid;

const docRef =
doc(db,"users",uid);

const snap =
await getDoc(docRef);

const data =
snap.data();

document.getElementById("dashboard")
.classList.remove("hidden");

document.getElementById("userName")
.innerText=data.name;

document.getElementById("userEmail")
.innerText=data.email;

document.getElementById("userBirth")
.innerText=data.birth;

document.getElementById("userCareer")
.innerText=data.career;

document.getElementById("userStars")
.innerText=data.stars;

alert("Đăng nhập thành công");

}
catch(error){

alert(error.message);

}

}

</script>

</body>
</html>
