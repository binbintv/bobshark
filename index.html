<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BobShark</title>
<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(180deg,#001d3d,#003566,#0077b6);color:#fff}
.hidden{display:none}
#intro{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#001d3d,#003566,#0077b6);overflow:hidden;display:flex;align-items:center;justify-content:center}
.fish{position:absolute;font-size:28px;animation:swim 12s linear infinite}
@keyframes swim{from{left:-20%}to{left:120%}}
.hero{text-align:center}
.btn{padding:12px 24px;border:none;border-radius:12px;background:#ffd60a;font-weight:bold;cursor:pointer;color:#000;font-size:18px}
.card{max-width:1000px;margin:20px auto;background:rgba(255,255,255,.12);padding:20px;border-radius:16px}
input,select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.day{padding:15px;border-radius:10px;text-align:center;background:#2563eb;cursor:pointer}
.locked{background:#555 !important}
.done{background:#16a34a !important}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);justify-content:center;align-items:center;z-index:10000}
.modal-content{background:#fff;color:#000;padding:25px;border-radius:15px;max-width:500px;width:90%}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tab{flex:1;padding:12px;border:none;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;font-weight:bold;min-width:120px}
.tab.active{background:#ffd60a;color:#000}
.auth-content{display:none}
.active-auth{display:block}
.footer{text-align:center;padding:20px;font-size:14px;opacity:0.8;margin-top:30px}
.footer i{font-style:italic}

/* Password Toggle */
.password-container { position: relative; }
.password-container input { padding-right: 45px; }
.toggle-password {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
    user-select: none;
}
</style>
</head>
<body>

<div id="intro">
    <div style="position:relative;width:100%;max-width:600px">
        <div class="fish" style="top:20%">🐟🐟🐟</div>
        <div class="fish" style="top:45%;animation-delay:2s">🐟🐟🐟🐟</div>
        <div class="fish" style="top:70%;animation-delay:4s">🐟🐟</div>
        <div style="position:absolute;top:25%;left:10%;font-size:80px;animation:swim 8s linear">🐬</div>
        <div class="hero">
            <h1 style="font-size:3rem;margin:0">🦈 BOBSHARK</h1>
            <p style="font-size:1.3rem">Đồng hành cùng Bob khai phá tương lai</p>
            <button class="btn" onclick="showRegister()">🚀 Bắt đầu hành trình</button>
        </div>
    </div>
</div>

<div id="authPage" class="hidden">
    <div class="card">
        <div class="tabs">
            <button class="tab active" onclick="showAuth('registerBox',this)">Đăng ký</button>
            <button class="tab" onclick="showAuth('loginBox',this)">Đăng nhập</button>
            <button class="tab" onclick="showAuth('adminLoginBox',this)">Đăng nhập Admin</button>
        </div>

        <div id="registerBox" class="auth-content active-auth">
            <div class="card">
                <h2>Tạo tài khoản</h2>
                <input id="regName" placeholder="Họ và tên">
                <input id="regUser" placeholder="Tên đăng nhập">
                <div class="password-container">
                    <input id="regPass" type="password" placeholder="Mật khẩu">
                    <span class="toggle-password" onclick="togglePassword('regPass', this)">👁️</span>
                </div>
                <input id="birth" type="date">
                <button class="btn" onclick="register()">Tạo tài khoản</button>
            </div>
        </div>

        <div id="loginBox" class="auth-content">
            <div class="card">
                <h2>🔑 Đăng nhập</h2>
                <input id="loginUser" placeholder="Tên đăng nhập">
                <div class="password-container">
                    <input id="loginPass" type="password" placeholder="Mật khẩu">
                    <span class="toggle-password" onclick="togglePassword('loginPass', this)">👁️</span>
                </div>
                <button class="btn" onclick="fakeLogin()">Đăng nhập</button>
            </div>
        </div>

        <div id="adminLoginBox" class="auth-content">
            <div class="card">
                <h2>👑 Đăng nhập Admin</h2>
                <input id="adminLoginUser" placeholder="Tên đăng nhập Admin" value="admin">
                <div class="password-container">
                    <input id="adminLoginPass" type="password" placeholder="Mật khẩu Admin" value="admin123">
                    <span class="toggle-password" onclick="togglePassword('adminLoginPass', this)">👁️</span>
                </div>
                <button class="btn" onclick="loginAdmin()">Đăng nhập Admin</button>
            </div>
        </div>
    </div>
</div>

<div id="app" class="hidden"> ... (giữ nguyên phần app) </div>

<!-- Modals và Footer giữ nguyên -->

<footer class="footer">
    <p>Liên hệ Admin: <strong>admin@bobshark.vn</strong> | Hotline: 0123 456 789</p>
    <p><i>Made by Team Siêu Quậy</i></p>
</footer>

<script>
const tasks = ["Khám phá bản thân","Tìm hiểu ngành CNTT","Tìm hiểu ngành Y","Khám phá Marketing","Khám phá kỹ năng mềm","Tìm hiểu trường đại học","Tổng kết hành trình"];

// Tự động tạo Admin nếu chưa có
function initAdmin() {
    let admins = JSON.parse(localStorage.getItem('bobAdmins') || '[]');
    if (admins.length === 0) {
        admins.push({
            name: "Super Admin",
            username: "admin",
            password: "admin123",
            role: "admin"
        });
        localStorage.setItem('bobAdmins', JSON.stringify(admins));
    }
}

async function getInternetDate(){ /* giữ nguyên */ }

function showRegister(){ /* giữ nguyên */ }
function showAuth(id, btn){ /* giữ nguyên */ }

// Toggle Password
function togglePassword(inputId, icon) {
    const input = document.getElementById(inputId);
    if (input.type === "password") {
        input.type = "text";
        icon.textContent = "🙈";
    } else {
        input.type = "password";
        icon.textContent = "👁️";
    }
}

// Các hàm register, fakeLogin, loginAdmin, loadApp... giữ nguyên như trước

// Khởi tạo
window.onload = () => {
    initAdmin();  // Tạo admin mặc định
};
</script>
</body>
</html>
