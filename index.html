<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BobShark MVP</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#0b3d91;color:white;overflow-x:hidden}
#intro{position:fixed;inset:0;background:linear-gradient(#001d3d,#003566,#0077b6);display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:9999}
.fish{position:absolute;font-size:28px;animation:swim 12s linear infinite}
@keyframes swim{from{left:-10%}to{left:110%}}
#title{font-size:48px;font-weight:bold;opacity:0;animation:fade 2s forwards 3s}
#startBtn{opacity:0;animation:fade 2s forwards 5s;padding:15px 30px;border:none;border-radius:30px;background:#ffd60a;font-weight:bold;cursor:pointer}
@keyframes fade{to{opacity:1}}
.card{max-width:900px;margin:20px auto;padding:20px;background:rgba(255,255,255,.12);border-radius:16px}
input,select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none}
button{padding:10px 16px;border:none;border-radius:8px;cursor:pointer}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:10px}
.day{padding:15px;background:#1f6feb;border-radius:10px;text-align:center;cursor:pointer}
.done{background:#00a86b}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center}
.modal-content{background:white;color:black;padding:20px;border-radius:15px;max-width:400px}
canvas{position:absolute;inset:0}
</style>
</head>
<body>

<div id="intro">
<canvas id="ocean"></canvas>
<div class="fish" style="top:25%">🐟🐟🐟</div>
<div class="fish" style="top:45%;animation-delay:2s">🐟🐟🐟🐟</div>
<div class="fish" style="top:65%;animation-delay:4s">🐟🐟</div>
<div style="font-size:80px;position:absolute;top:30%;animation:swim 8s linear 1">🐬</div>
<div id="title">🦈 BOBSHARK AI</div>
<p style="opacity:0;animation:fade 2s forwards 4s">Đồng hành cùng Bob khai phá tương lai</p>
<button id="startBtn">🚀 BẮT ĐẦU HÀNH TRÌNH</button>
</div>

<div id="app" style="display:none">
<div class="card">
<h1>🦈 BobShark AI</h1>
<p>Khám phá nghề nghiệp tương lai</p>
</div>

<div class="card">
<h2>Thông tin cá nhân</h2>
<input id="name" placeholder="Nhập họ tên">
<select id="interest">
<option>Công nghệ</option>
<option>Y tế</option>
<option>Kinh doanh</option>
<option>Thiết kế</option>
<option>Giáo dục</option>
</select>
<button onclick="analyze()">Phân tích nghề nghiệp</button>
<div id="result"></div>
</div>

<div class="card">
<h2>📅 Hành trình 7 ngày</h2>
<div class="days" id="days"></div>
</div>

<div class="card">
<h2>🎁 Gacha</h2>
<button onclick="openGacha()">Mở Gacha</button>
</div>
</div>

<div class="modal" id="modal">
<div class="modal-content">
<h2>🦈 BobShark</h2>
<p>Tính năng Gacha hiện đang bảo trì 🚧<br>Hãy tiếp tục hoàn thành nhiệm vụ để tích lũy sao nhé ⭐</p>
<button onclick="closeGacha()">Đã hiểu</button>
</div>
</div>

<script>
const canvas=document.getElementById('ocean');
const ctx=canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}
resize();window.onresize=resize;
function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);
for(let x=0;x<canvas.width;x+=10){
let y=Math.sin((x+Date.now()/20)/40)*10+canvas.height*0.7;
ctx.fillStyle='rgba(0,200,255,.5)';
ctx.fillRect(x,y,10,canvas.height-y);
}
requestAnimationFrame(draw);
}
draw();

document.getElementById('startBtn').onclick=()=>{
document.getElementById('intro').style.display='none';
document.getElementById('app').style.display='block';
};

const careerMap={
"Công nghệ":"CNTT - Lập trình viên, AI Engineer",
"Y tế":"Bác sĩ, Điều dưỡng",
"Kinh doanh":"Marketing, Quản trị kinh doanh",
"Thiết kế":"Thiết kế đồ họa, UI/UX",
"Giáo dục":"Giáo viên, Giảng viên"
};

function analyze(){
const name=document.getElementById('name').value;
const interest=document.getElementById('interest').value;
if(!name){alert('Nhập họ tên');return;}
localStorage.setItem('bob_name',name);
document.getElementById('result').innerHTML=
`<h3>Xin chào ${name}</h3>
<p>Ngành phù hợp: <b>${careerMap[interest]}</b></p>
<p>Mức độ phù hợp: ${90+Math.floor(Math.random()*10)}%</p>`;
}

const days=document.getElementById('days');
for(let i=1;i<=7;i++){
let d=document.createElement('div');
d.className='day';
d.innerHTML='Ngày '+i;
d.onclick=()=>d.classList.toggle('done');
days.appendChild(d);
}

function openGacha(){document.getElementById('modal').style.display='flex';}
function closeGacha(){document.getElementById('modal').style.display='none';}
</script>
</body>
</html>
