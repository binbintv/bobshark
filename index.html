<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BobShark</title>
<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(180deg,#001d3d,#003566,#0077b6);color:#fff}
.hidden{display:none}
.center{display:flex;justify-content:center;align-items:center}
#intro{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#001d3d,#003566,#0077b6);overflow:hidden}
.fish{position:absolute;font-size:28px;animation:swim 12s linear infinite}
@keyframes swim{from{left:-20%}to{left:120%}}
.hero{position:absolute;top:40%;width:100%;text-align:center}
.btn{padding:12px 24px;border:none;border-radius:12px;background:#ffd60a;font-weight:bold;cursor:pointer;color:#000}
.card{max-width:1000px;margin:20px auto;background:rgba(255,255,255,.12);padding:20px;border-radius:16px}
input,select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.day{padding:15px;border-radius:10px;text-align:center;background:#2563eb;cursor:pointer}
.locked{background:#555 !important}
.done{background:#16a34a !important}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);justify-content:center;align-items:center;z-index:10000}
.modal-content{background:#fff;color:#000;padding:25px;border-radius:15px;max-width:500px;width:90%}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{flex:1;padding:12px;border:none;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;font-weight:bold}
.tab.active{background:#ffd60a;color:#000}
.auth-content{display:none}
.active-auth{display:block;animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card{animation:floatIn .7s ease}
@keyframes floatIn{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div id="intro">
    <div class="fish" style="top:20%">🐟🐟🐟</div>
    <div class="fish" style="top:45%;animation-delay:2s">🐟🐟🐟🐟</div>
    <div class="fish" style="top:70%;animation-delay:4s">🐟🐟</div>
    <div style="position:absolute;top:25%;left:10%;font-size:80px;animation:swim 8s linear">🐬</div>
    <div class="hero">
        <h1>🦈 BOBSHARK</h1>
        <p>Đồng hành cùng Bob khai phá tương lai</p>
        <button class="btn" onclick="showRegister()">🚀 Bắt đầu hành trình</button>
    </div>
</div>

<div id="authPage" class="hidden">
    <div class="card">
        <div class="tabs">
            <button class="tab active" onclick="showAuth('registerBox',this)">Đăng ký</button>
            <button class="tab" onclick="showAuth('loginBox',this)">Đăng nhập</button>
        </div>
        <div id="registerBox" class="auth-content active-auth">
            <div class="card">
                <h2>Tạo tài khoản</h2>
                <input id="regName" placeholder="Họ và tên">
                <input id="regUser" placeholder="Tên đăng nhập">
                <input id="regPass" type="password" placeholder="Mật khẩu">
                <input id="birth" type="date">
                <button class="btn" onclick="register()">Tạo tài khoản</button>
            </div>
        </div>
        <div id="loginBox" class="auth-content">
            <div class="card">
                <h2>🔑 Đăng nhập</h2>
                <input id="loginUser" placeholder="Tên đăng nhập">
                <input id="loginPass" type="password" placeholder="Mật khẩu">
                <button class="btn" onclick="fakeLogin()">Đăng nhập</button>
            </div>
        </div>
    </div>
</div>

<div id="app" class="hidden">
    <div class="card">
        <h1>🦈 BobShark AI</h1>
        <p id="welcome"></p>
        <p id="today"></p>
        <p id="stars"></p>
    </div>

    <div class="card">
        <h2>🎯 Phân tích nghề nghiệp</h2>
        <select id="job">
            <option>AI Engineer</option>
            <option>Lập trình viên</option>
            <option>Bác sĩ</option>
            <option>Marketing</option>
            <option>Giáo viên</option>
        </select>
        <button class="btn" onclick="analyze()">Phân tích</button>
        <div id="analysis"></div>
    </div>

    <div class="card">
        <h2>📅 Hành trình 7 ngày</h2>
        <div id="days" class="days"></div>
    </div>

    <div class="card">
        <h2>🎁 Gacha</h2>
        <button class="btn" onclick="openGacha()">Mở Gacha</button>
    </div>

    <div class="card">
        <h2>👑 Quản trị</h2>
        <button class="btn" onclick="openAdminLogin()">Admin</button>
    </div>
</div>

<!-- Modals -->
<div class="modal" id="modal">
    <div class="modal-content">
        <h2>🚧 Gacha bảo trì</h2>
        <p>Tính năng đang được nâng cấp.</p>
        <button class="btn" onclick="closeGacha()">Đã hiểu</button>
    </div>
</div>

<div class="modal" id="taskModal">
    <div class="modal-content">
        <h2 id="taskTitle"></h2>
        <p id="taskText"></p>
        <button class="btn" onclick="completeTask()">Hoàn thành nhiệm vụ</button>
    </div>
</div>

<div class="modal" id="adminModal">
    <div class="modal-content">
        <h2>👑 Đăng nhập Admin</h2>
        <input id="adminPassword" type="password" placeholder="Nhập mật khẩu Admin">
        <br><br>
        <button class="btn" onclick="checkAdmin()">Đăng nhập</button>
        <button class="btn" onclick="closeAdminLogin()">Hủy</button>
    </div>
</div>

<script>
const tasks = [
    "Khám phá bản thân",
    "Tìm hiểu ngành CNTT",
    "Tìm hiểu ngành Y",
    "Khám phá Marketing",
    "Khám phá kỹ năng mềm",
    "Tìm hiểu trường đại học",
    "Tổng kết hành trình"
];

// Cache DOM elements
let dom = {};
function cacheDOM() {
    dom = {
        intro: document.getElementById('intro'),
        authPage: document.getElementById('authPage'),
        app: document.getElementById('app'),
        welcome: document.getElementById('welcome'),
        today: document.getElementById('today'),
        stars: document.getElementById('stars'),
        days: document.getElementById('days'),
        analysis: document.getElementById('analysis'),
        taskModal: document.getElementById('taskModal'),
        taskTitle: document.getElementById('taskTitle'),
        taskText: document.getElementById('taskText'),
        modal: document.getElementById('modal'),
        adminModal: document.getElementById('adminModal'),
        adminPassword: document.getElementById('adminPassword'),
        regName: document.getElementById('regName'),
        regUser: document.getElementById('regUser'),
        regPass: document.getElementById('regPass'),
        birth: document.getElementById('birth'),
        loginUser: document.getElementById('loginUser'),
        loginPass: document.getElementById('loginPass')
    };
}

async function getInternetDate() {
    try {
        const r = await fetch('https://worldtimeapi.org/api/timezone/Asia/Ho_Chi_Minh');
        const d = await r.json();
        return new Date(d.datetime);
    } catch(e) {
        return new Date();
    }
}

function showRegister() {
    dom.intro.style.display = 'none';
    dom.authPage.classList.remove('hidden');
}

function showAuth(id, btn) {
    document.querySelectorAll('.auth-content').forEach(x => x.classList.remove('active-auth'));
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.getElementById(id).classList.add('active-auth');
    btn.classList.add('active');
}

async function register() {
    if (!dom.regUser.value || !dom.regPass.value) {
        alert("Vui lòng điền đầy đủ thông tin!");
        return;
    }
    const user = {
        name: dom.regName.value || "Bob",
        username: dom.regUser.value,
        password: dom.regPass.value,
        birth: dom.birth.value,
        startDate: (await getInternetDate()).toISOString(),
        stars: 0,
        progress: [false, false, false, false, false, false, false]
    };
    localStorage.setItem('bobUser', JSON.stringify(user));
    loadApp();
}

function fakeLogin() {
    const u = JSON.parse(localStorage.getItem('bobUser') || 'null');
    if (!u) {
        alert('Chưa có tài khoản. Vui lòng đăng ký!');
        return;
    }
    if (dom.loginUser.value === u.username && dom.loginPass.value === u.password) {
        loadApp();
    } else {
        alert('Sai tài khoản hoặc mật khẩu');
    }
}

async function loadApp() {
    const user = JSON.parse(localStorage.getItem('bobUser'));
    if (!user) return;

    dom.authPage.classList.add('hidden');
    dom.app.classList.remove('hidden');

    const now = await getInternetDate();
    dom.welcome.innerText = `Xin chào ${user.name} 👋`;
    dom.today.innerText = `📅 ${now.toLocaleDateString('vi-VN')}`;
    dom.stars.innerText = `⭐ Sao: ${user.stars}`;
    renderDays();
}

async function getUnlockedDay() {
    const user = JSON.parse(localStorage.getItem('bobUser'));
    const start = new Date(user.startDate);
    const now = await getInternetDate();
    return Math.min(Math.floor((now - start) / (1000 * 60 * 60 * 24)) + 1, 7);
}

async function renderDays() {
    const user = JSON.parse(localStorage.getItem('bobUser'));
    const unlocked = await getUnlockedDay();
    dom.days.innerHTML = '';

    for (let i = 0; i < 7; i++) {
        let d = document.createElement('div');
        if (user.progress[i]) {
            d.className = 'day done';
            d.innerHTML = `Ngày ${i+1}<br>✅ Đã hoàn thành`;
        } else if (i + 1 <= unlocked) {
            d.className = 'day';
            d.innerHTML = `Ngày ${i+1}`;
            d.onclick = () => openTask(i);
        } else {
            d.className = 'day locked';
            d.innerHTML = `🔒 Ngày ${i+1}`;
        }
        dom.days.appendChild(d);
    }
}

let currentTask = 0;
function openTask(i) {
    currentTask = i;
    dom.taskTitle.innerText = `Nhiệm vụ ngày ${i+1}`;
    dom.taskText.innerText = tasks[i];
    dom.taskModal.style.display = 'flex';
}

function completeTask() {
    let user = JSON.parse(localStorage.getItem('bobUser'));
    if (!user.progress[currentTask]) {
        user.progress[currentTask] = true;
        user.stars += 50;
    }
    localStorage.setItem('bobUser', JSON.stringify(user));
    dom.taskModal.style.display = 'none';
    renderDays();
    loadApp();

    if (user.progress.every(v => v)) {
        alert('🎉 Chúc mừng bạn đã hoàn thành 7 ngày hành trình!');
    }
}

function analyze() {
    const user = JSON.parse(localStorage.getItem('bobUser'));
    const job = document.getElementById('job').value;
    const score = 65 + Math.floor(Math.random() * 35);
    dom.analysis.innerHTML = `
        <h3>${job}</h3>
        <p>Độ phù hợp: <b>${score}%</b></p>
        <p>Ngày sinh: ${user.birth ? new Date(user.birth).toLocaleDateString('vi-VN') : 'Chưa cập nhật'}</p>
    `;
}

function openGacha() { dom.modal.style.display = 'flex'; }
function closeGacha() { dom.modal.style.display = 'none'; }
function openAdminLogin() { dom.adminModal.style.display = 'flex'; }
function closeAdminLogin() { dom.adminModal.style.display = 'none'; }

function checkAdmin() {
    if (dom.adminPassword.value === 'admin123') {
        window.location.href = 'admin.html'; // bạn cần tạo file này
    } else {
        alert('Sai mật khẩu Admin');
    }
}

window.onload = () => {
    cacheDOM();
    if (localStorage.getItem('bobUser')) loadApp();
};
</script>
</body>
</html>
