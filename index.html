<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BobShark</title>
<style>
/* Style giữ nguyên như trước */
body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(180deg,#001d3d,#003566,#0077b6);color:#fff}
.hidden{display:none}
#intro{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#001d3d,#003566,#0077b6);overflow:hidden;display:flex;align-items:center;justify-content:center}
.fish{position:absolute;font-size:28px;animation:swim 12s linear infinite}
@keyframes swim{from{left:-20%}to{left:120%}}
.hero{text-align:center}
.btn{padding:12px 24px;border:none;border-radius:12px;background:#ffd60a;font-weight:bold;cursor:pointer;color:#000;font-size:18px}
.card{max-width:1000px;margin:20px auto;background:rgba(255,255,255,.12);padding:20px;border-radius:16px}
input,select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.day{padding:15px;border-radius:10px;text-align:center;background:#2563eb;cursor:pointer}
.locked{background:#555 !important}
.done{background:#16a34a !important}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);justify-content:center;align-items:center;z-index:10000}
.modal-content{background:#fff;color:#000;padding:25px;border-radius:15px;max-width:500px;width:90%}
.tabs{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.tab{flex:1;padding:12px;border:none;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;font-weight:bold;min-width:120px}
.tab.active{background:#ffd60a;color:#000}
.auth-content{display:none}
.active-auth{display:block}
.footer{text-align:center;padding:15px;font-size:13px;opacity:0.7;margin-top:20px}
.password-container { position: relative; }
.password-container input { padding-right: 45px; }
.toggle-password {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 18px;
}
</style>
</head>
<body>

<!-- Phần intro, authPage, app giữ nguyên như file trước -->
<!-- ... (để ngắn gọn, bạn copy từ file cũ của bạn) ... -->

<!-- Chỉ thay đổi phần script quan trọng -->

<script>
const tasks = ["Khám phá bản thân","Tìm hiểu ngành CNTT","Tìm hiểu ngành Y","Khám phá Marketing","Khám phá kỹ năng mềm","Tìm hiểu trường đại học","Tổng kết hành trình"];

function initAdmin() {
    let admins = JSON.parse(localStorage.getItem('bobAdmins') || '[]');
    if (admins.length === 0) {
        admins.push({name: "Super Admin", username: "admin", password: "admin123", role: "admin"});
        localStorage.setItem('bobAdmins', JSON.stringify(admins));
    }
}

// Các hàm khác giữ nguyên (showRegister, showAuth, togglePassword, register, fakeLogin, loginAdmin...)

async function register(){
    const name = document.getElementById('regName').value.trim();
    const username = document.getElementById('regUser').value.trim();
    const password = document.getElementById('regPass').value.trim();
    const birth = document.getElementById('birth').value;

    if(!username || !password){
        alert("Vui lòng nhập tên đăng nhập và mật khẩu!");
        return;
    }

    const user = {
        name: name || "Bob",
        username: username,
        password: password,
        birth: birth,
        startDate: (await getInternetDate()).toISOString(),
        stars: 0,
        progress: [false,false,false,false,false,false,false],
        analysisScores: {}
    };

    // LƯU RẤT RÕ VÀO DANH SÁCH ADMIN
    let users = JSON.parse(localStorage.getItem('bobUsers') || '[]');
    users.push(user);
    localStorage.setItem('bobUsers', JSON.stringify(users));

    localStorage.setItem('bobUser', JSON.stringify(user));

    alert("✅ Đăng ký thành công!");
    loadApp();
}

// Các hàm loadApp, renderDays, analyze... giữ nguyên

// Thêm hàm Export / Import cho Admin
function exportData() {
    const data = {
        bobUsers: JSON.parse(localStorage.getItem('bobUsers') || '[]'),
        bobAdmins: JSON.parse(localStorage.getItem('bobAdmins') || '[]')
    };
    const str = JSON.stringify(data, null, 2);
    const blob = new Blob([str], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'bobshark_backup.json';
    a.click();
}

function importData() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json';
    input.onchange = e => {
        const file = e.target.files[0];
        const reader = new FileReader();
        reader.onload = ev => {
            try {
                const data = JSON.parse(ev.target.result);
                if(data.bobUsers) localStorage.setItem('bobUsers', JSON.stringify(data.bobUsers));
                if(data.bobAdmins) localStorage.setItem('bobAdmins', JSON.stringify(data.bobAdmins));
                alert("✅ Import dữ liệu thành công!");
                location.reload();
            } catch(err) {
                alert("File không hợp lệ!");
            }
        };
        reader.readAsText(file);
    };
    input.click();
}

window.onload = () => {
    initAdmin();
};
</script>
</body>
</html>
