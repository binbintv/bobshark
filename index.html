<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BobShark</title>
<style>
body{margin:0;font-family:Segoe UI,sans-serif;background:linear-gradient(180deg,#001d3d,#003566,#0077b6);color:#fff}
.hidden{display:none}
#intro{position:fixed;inset:0;z-index:9999;background:linear-gradient(180deg,#001d3d,#003566,#0077b6);overflow:hidden}
.hero{position:absolute;top:40%;width:100%;text-align:center}
.btn{padding:12px 24px;border:none;border-radius:12px;background:#ffd60a;font-weight:bold;cursor:pointer;color:#000}
.card{max-width:1000px;margin:20px auto;background:rgba(255,255,255,.12);padding:20px;border-radius:16px}
input,select{width:100%;padding:10px;margin:8px 0;border-radius:8px;border:none}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.day{padding:15px;border-radius:10px;text-align:center;background:#2563eb;cursor:pointer}
.locked{background:#555}
.done{background:#16a34a}
.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);justify-content:center;align-items:center}
.modal-content{background:#fff;color:#000;padding:20px;border-radius:15px;max-width:500px}
.tabs{display:flex;gap:10px;margin-bottom:20px}
.tab{flex:1;padding:12px;border:none;border-radius:12px;cursor:pointer;background:rgba(255,255,255,.15);color:#fff;font-weight:bold}
.tab.active{background:#ffd60a;color:#000}
.auth-content{display:none}
.active-auth{display:block}
.password-container { position: relative; }
*{
    box-sizing:border-box;
}

.password-container{
    position:relative;
    width:100%;
}

.password-container input{
    width:100%;
    box-sizing:border-box;
    padding-right:45px;
}

.toggle-password{
    position:absolute;
    right:12px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
    font-size:18px;
}
.footer{text-align:center;padding:15px;font-size:13px;opacity:0.8;margin-top:20px}
.footer i{font-style:italic}
</style>
</head>
<body>
<div id="adminBadge"
style="
display:none;
position:fixed;
top:15px;
right:15px;
background:#ef4444;
color:white;
padding:10px 18px;
border-radius:20px;
font-weight:bold;
z-index:99999;
">
👑 ADMIN
</div>
<div id="intro">
    <video id="introVideo"
autoplay
muted
playsinline
style="
position:absolute;
width:100%;
height:100%;
object-fit:cover;
">
<source src="intro.mp4" type="video/mp4">
</video>
    <div class="hero" id="heroContent" style="display:none;">
        <h1>🦈 BOBSHARK</h1>

        <p>Đồng hành cùng Bob khai phá tương lai</p>
        <button class="btn" onclick="showRegister()">🚀 Bắt đầu hành trình</button>
    </div>
</div>

<div id="authPage" class="hidden">
    <div class="card">
        <div class="tabs">
            <button class="tab active" onclick="showAuth('registerBox',this)">Đăng ký</button>
            <button class="tab" onclick="showAuth('loginBox',this)">Đăng nhập</button>
            <button class="tab" onclick="showAuth('adminLoginBox',this)">Đăng nhập Admin</button>
        </div>

        <div id="registerBox" class="auth-content active-auth">
            <div class="card">
                <h2>Tạo tài khoản</h2>
                <input id="regEmail" type="email" placeholder="Email">
                <input id="regName" placeholder="Họ và tên">
                <div class="password-container">
                    <input id="regPass" type="password" placeholder="Mật khẩu">
                    <span class="toggle-password" onclick="togglePassword('regPass', this)">👁️</span>
                </div>
                <input id="birth" type="date">
                <button class="btn" onclick="registerWithFirebase()">Tạo tài khoản</button>
            </div>
        </div>

        <div id="loginBox" class="auth-content">
            <div class="card">
                <h2>🔑 Đăng nhập</h2>
                <input id="loginEmail" type="email" placeholder="Email">
                <div class="password-container">
                    <input id="loginPass" type="password" placeholder="Mật khẩu">
                    <span class="toggle-password" onclick="togglePassword('loginPass', this)">👁️</span>
                </div>
                <button class="btn" onclick="loginWithFirebase()">Đăng nhập</button>
                <p style="margin-top:10px;">
<a href="#" onclick="openForgotModal()">
Quên mật khẩu?
</a>
</p>
            </div>
        </div>

        <div id="adminLoginBox" class="auth-content">
            <div class="card">
                <h2>👑 Đăng nhập Admin</h2>
                <input id="adminLoginUser" placeholder="Tên đăng nhập Admin">
                <div class="password-container">
                    <input id="adminLoginPass" type="password" placeholder="Mật khẩu Admin">
                    <span class="toggle-password" onclick="togglePassword('adminLoginPass', this)">👁️</span>
                </div>
                <button class="btn" onclick="loginAdmin()">Đăng nhập Admin</button>
            </div>
        </div>
    </div>
</div>

<div id="app" class="hidden">

    <div class="card">
        <button onclick="logoutUser()"
        style="float:right;background:#ef4444;color:white;border:none;padding:10px 15px;border-radius:8px;cursor:pointer;">
        Đăng xuất
        </button>

        <h1>🦈 BobShark AI</h1>
        <p id="welcome"></p>
        <p id="today"></p>
       <p id="stars"></p>

<br>

<button class="btn" onclick="startJourney()">
🚀 Bắt đầu hành trình
</button>

    </div>

</div>
<footer class="footer">
    <p>Admin: nguyennhatnem2009@gmail.com | Hotline: 0347961309</p>
    <p><i>Design by Cubinzz</i></p>
</footer>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

<script>
// Khởi tạo Firebase
firebase.initializeApp({
    apiKey: "AIzaSyDGX-qWZTPgOszBO-Mem4wKwh-HpMACPUk",
    authDomain: "bobshark-fbdfb.firebaseapp.com",
    projectId: "bobshark-fbdfb",
    storageBucket: "bobshark-fbdfb.firebasestorage.app",
    messagingSenderId: "810024180746",
    appId: "1:810024180746:web:4419819dff374b5a04d3f3"
});

const auth = firebase.auth();
const db = firebase.firestore();

function showRegister(){
    document.getElementById('intro').style.display = 'none';
    document.getElementById('authPage').classList.remove('hidden');
    document.getElementById('app').classList.add('hidden');
}

function showAuth(id, btn){
    document.querySelectorAll('.auth-content').forEach(x => x.classList.remove('active-auth'));
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    document.getElementById(id).classList.add('active-auth');
    btn.classList.add('active');
}

function togglePassword(inputId, icon){
    const input = document.getElementById(inputId);
    if(input.type === "password"){
        input.type = "text";
        icon.textContent = "🙈";
    } else {
        input.type = "password";
        icon.textContent = "👁️";
    }
}

// Đăng ký với Firebase Auth
async function registerWithFirebase(){
    const email = document.getElementById('regEmail').value.trim();
    const password = document.getElementById('regPass').value.trim();
    const name = document.getElementById('regName').value.trim();

    if(!email || !password){
        alert("Vui lòng nhập Email và Mật khẩu!");
        return;
    }

    try {
        const userCredential = await auth.createUserWithEmailAndPassword(email, password);
        const user = userCredential.user;

        await db.collection("users").doc(user.uid).set({
            name: name || "Bob",
            email: email,
            birth: document.getElementById('birth').value,
            startDate: new Date().toISOString(),
            stars: 0,
            progress: [false,false,false,false,false,false,false]
        });

        alert("✅ Đăng ký thành công!");
        loadApp();
    } catch(e) {
        alert("Lỗi đăng ký: " + e.message);
    }
}

// Đăng nhập với Firebase Auth
async function loginWithFirebase(){
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPass').value.trim();

    try {
        await auth.signInWithEmailAndPassword(email, password);
        alert("✅ Đăng nhập thành công!");
        loadApp();
    } catch(e) {
        alert("Sai email hoặc mật khẩu!");
    }
}

async function loadApp(){

    const user = auth.currentUser;
    if(!user) return;

    document.getElementById('intro').style.display='none';
    document.getElementById('authPage').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    document.getElementById('welcome').innerText =
        `Xin chào ${user.email} 👋`;

    document.getElementById('today').innerText =
        `📅 ${new Date().toLocaleDateString('vi-VN')}`;

    document.getElementById('stars').innerText =
        `⭐ Đã đăng nhập thành công`;

    // ADMIN
    if(user.email === "nguyennhatnem2009@gmail.com"){

        localStorage.setItem("adminRank","true");

        document.getElementById("adminBadge").style.display = "block";

document.getElementById("adminBadge").innerHTML =
"👑 ADMIN";

    }else{

        localStorage.removeItem("adminRank");

    }
}
function logoutUser(){

    document.getElementById("adminBadge")
    .style.display = "none";

    auth.signOut().then(() => location.reload());

}
function loginAdmin(){

    let username =
    document.getElementById("adminLoginUser").value;

    let password =
    document.getElementById("adminLoginPass").value;

    if(
        username == "admin" &&
        password == "admin123"
    ){

        window.location.href =
        "admin.html";

    }else{

        alert("Sai tài khoản hoặc mật khẩu");

    }

}
function startJourney(){
    window.location.href = "trangchu.html";
}

async function forgotPassword(){

    const email =
    document.getElementById("loginEmail").value.trim();

    if(!email){
        alert("Vui lòng nhập Email trước.");
        return;
    }

    try{
        await auth.sendPasswordResetEmail(email);

        alert(
        "📧 Đã gửi email đặt lại mật khẩu. Vui lòng kiểm tra hộp thư."
        );

    }catch(error){
        alert("Lỗi: " + error.message);
    }
}
function openForgotModal(){
    document.getElementById("forgotModal").style.display = "flex";
}

function closeForgotModal(){
    document.getElementById("forgotModal").style.display = "none";
}

async function sendResetEmail(){

    const email =
    document.getElementById("forgotEmail").value.trim();

    if(!email){
        alert("Vui lòng nhập Email");
        return;
    }

    try{

        await auth.sendPasswordResetEmail(email);

        alert("📧 Đã gửi email đặt lại mật khẩu!");

        closeForgotModal();

    }catch(error){

        alert("Lỗi: " + error.message);

    }

}
window.onload = () => {

    auth.onAuthStateChanged(user => {

        if(user){
            loadApp();
        }else{
            document.getElementById('intro').style.display='block';
            document.getElementById('authPage').classList.add('hidden');
            document.getElementById('app').classList.add('hidden');
        }

    });

    document.getElementById("introVideo").onended = function(){

        document.getElementById("heroContent")
        .style.display = "block";

    };

};
</script>
<div id="forgotModal"
style="
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.7);
justify-content:center;
align-items:center;
z-index:9999;
">

<div style="
background:white;
color:black;
padding:25px;
border-radius:15px;
width:350px;
">

<h3>Quên mật khẩu</h3>

<input
id="forgotEmail"
type="email"
placeholder="Nhập email của bạn"
style="
width:100%;
padding:10px;
margin:10px 0;
">

<button class="btn"
onclick="sendResetEmail()">
📧 Gửi
</button>

<button class="btn"
style="background:#ef4444;color:white;"
onclick="closeForgotModal()">
❌ Hủy
</button>

</div>
</div>
</body>
</html>
